<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz</title>
</head>
<body>
    <form>
        <fieldset><!--here start the test-->
            <legend>Full Name</legend>
            <input type="text" placeholder="your name">
        </fieldset>

        <fieldset><!--multiple choise section-->
            <legend>Multiple choise question</legend>

            <p><b>1. What is 5 &plus; 3?</b></p>
            <input type="radio" name="first" value="6">6<br/>
            <input type="radio" name="first" value="7">7<br/>
            <input type="radio" name="first" value="8">8<br/>
            <input type="radio" name="first" value="9">9<br/>

            <p><b>2. What is 10 &times; 2?</b></p>
            <input type="radio" name="second" value="12">12<br/>
            <input type="radio" name="second" value="5">5<br/>
            <input type="radio" name="second" value="20">20<br/>
            <input type="radio" name="second" value="30">30<br/>

            <p><b>3. What is 20 &div; 4?</b></p>
            <input type="radio" name="third" value="5">5<br/>
            <input type="radio" name="third" value="0.5">0.5<br/>
            <input type="radio" name="third" value="80">80<br/>
            <input type="radio" name="third" value="4">4<br/>
        </fieldset>
        
        <fieldset><!--Open question section-->
            <legend>Open question</legend>
            <p><b>4. If you have 20 apples and give 7 to your friend, how many apples do you have left? Explain your answer.</b></p>
            <textarea name="20 apples" rows="3" cols="40"></textarea>
        </fieldset><!--here end the test-->

        <button type="submit" value="submit">click here to submit</button>
    </form>
</body>
</html>
