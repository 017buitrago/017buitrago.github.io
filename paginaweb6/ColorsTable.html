<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors table</title>
</head>
<body>
    <style>
        table, tr, td, th{
          border: 1px solid black;
        }
    </style>
    <table>
        <tr>
            <th colspan="4"><span style="font-family:cursive;">My colors table</span></th>
        </tr>
        <tr>
            <td style="background-color:#8A2BE2;"><span style="color: white; font-family: monospace;">BlueViolet</span></td>
            <td style="background-color: rgb(127, 255, 0);"><span style="color: black; font-family: 'Courier New', Courier, monospace;">Chartreuse</span></td>
            <td style="background-color: hsl(180, 100%, 27%);"><span style="color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">DarkCyan</span></td>
            <td style="background-color: #00008B;"><span style="color: white; font-family: Georgia, 'Times New Roman', Times, serif;">DarkBlue</span></td>
        </tr>
        <tr>
            <td>Hex: #8A2BE2</td>
            <td>Hex: #7FFF00</td>
            <td>Hex: #008B8B</td>
            <td>Hex: #00008B</td>
        </tr>
        <tr>
            <td>rgb: 138, 43, 226</td>
            <td>rgb: 127, 255, 0</td>
            <td>rgb: 0, 139, 139</td>
            <td>rgb: 0, 0, 139</td>
        </tr>
        <tr>
            <td>hsl: 271, 76%, 53%</td>
            <td>hsl: 90, 100%, 50%</td>
            <td>hsl: 180, 100%, 27%</td>
            <td>hsl: 240, 100%, 27%</td>
        </tr>
    </table>
</body>
</html>
